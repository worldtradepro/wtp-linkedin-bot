name: image-search-test

# Diagnostic only: checks that Bing Images answers from the GitHub runner and shows what image_search.mjs picks.
# Nothing is posted; result goes to branch images/image-test/.

on:
  workflow_dispatch:
  push:
    paths:
      - test_image_search.mjs
      - image_search.mjs
      - .github/workflows/image-search-test.yml

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Run the diagnostic
        run: node test_image_search.mjs
      - name: Publish the result (branch images)
        if: always()
        run: |
          set -e
          git config user.name "wtp-bot"
          git config user.email "wtp-bot@users.noreply.github.com"
          git fetch origin images
          git worktree add -B images ../_images origin/images
          mkdir -p ../_images/image-test
          cp image_test/* ../_images/image-test/ 2>/dev/null || true
          cd ../_images
          git add -A
          git diff --cached --quiet || git commit -m "image-test $(date -u +%FT%TZ)"
          git push origin HEAD:images
