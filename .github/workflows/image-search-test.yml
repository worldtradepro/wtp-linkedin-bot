name: image-search-test

# Diagnostic only: checks that the same-story news photo search (Bing News RSS + article og:image) works from the GitHub runner.
# Nothing is posted; result goes to branch images/image-test/.

# Manual only since 2026-11-22: the push trigger ran it on every image_search.mjs change and each run hit the
# 10-minute timeout (cancelled), which showed as a red light on the dashboard.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Run the diagnostic
        run: node test_image_search.mjs
      - name: Publish the result (branch images)
        if: always()
        run: |
          set -e
          git config user.name "wtp-bot"
          git config user.email "wtp-bot@users.noreply.github.com"
          git fetch origin images
          git worktree add -B images ../_images origin/images
          mkdir -p ../_images/image-test
          cp image_test/* ../_images/image-test/ 2>/dev/null || true
          cd ../_images
          git add -A
          git diff --cached --quiet || git commit -m "image-test $(date -u +%FT%TZ)"
          git push origin HEAD:images
