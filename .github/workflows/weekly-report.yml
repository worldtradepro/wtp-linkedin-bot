name: weekly-report

# Trade Flow Weekly, fully automatic with a human review window:
#   Sunday 18:17 UTC  stage   : data -> editorial note (OpenRouter) -> fact-check -> render (article, PDF, images)
#                               -> files to branch "images" (weekly/<slug>/) -> WordPress DRAFT -> review e-mail to the owner
#   Monday 06:07 UTC  publish : unless held from the e-mail -> article live + forum thread -> LinkedIn PDF via Buffer 07:30 UTC
# Pause switch: Settings -> Secrets and variables -> Actions -> Variables -> WEEKLY_PAUSED = true
# Secrets: OPENROUTER_API_KEY, WTP_PUBLISH_KEY (Settings -> WTP Insights publishing in WordPress), BUFFER_API_KEY,
#          AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY (SES, review mail)

on:
  schedule:
    - cron: '17 18 * * 0'    # Sunday: stage + review mail
    - cron: '7 6 * * 1'      # Monday: publish
  workflow_dispatch:
    inputs:
      step:
        description: 'stage or publish'
        required: true
        default: 'stage'
      date:
        description: 'Monday of publication YYYY-MM-DD (empty = next/this Monday)'
        default: ''
      mail:
        description: 'stage only: send the review e-mail (1/0)'
        default: '1'

permissions:
  contents: write

concurrency:
  group: weekly-report
  cancel-in-progress: false

jobs:
  run:
    if: ${{ vars.WEEKLY_PAUSED != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      WTP_PUBLISH_KEY: ${{ secrets.WTP_PUBLISH_KEY }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Which step, which week
        id: w
        run: |
          STEP="${{ github.event.inputs.step }}"
          if [ -z "$STEP" ]; then
            if [ "${{ github.event.schedule }}" = "7 6 * * 1" ]; then STEP=publish; else STEP=stage; fi
          fi
          DATE="${{ github.event.inputs.date }}"
          if [ -z "$DATE" ]; then
            if [ "$STEP" = "publish" ]; then DATE=$(date -u -d "$( [ "$(date -u +%u)" = 1 ] && echo today || echo 'last monday')" +%F); else DATE=$(date -u -d 'next monday' +%F); fi
          fi
          echo "step=$STEP" >> "$GITHUB_OUTPUT"; echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "Trade Flow Weekly: $STEP for Monday $DATE"
      - name: Check secrets
        run: |
          test -n "$WTP_PUBLISH_KEY" || { echo "::error::Secret WTP_PUBLISH_KEY is missing (WordPress: Settings -> WTP Insights publishing)"; exit 1; }
          if [ "${{ steps.w.outputs.step }}" = "stage" ]; then
            test -n "$OPENROUTER_API_KEY" || { echo "::error::Secret OPENROUTER_API_KEY is missing"; exit 1; }
          else
            test -n "$BUFFER_API_KEY" || { echo "::error::Secret BUFFER_API_KEY is missing"; exit 1; }
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # ---------------- Sunday: stage
      - name: Install (render tools)
        if: ${{ steps.w.outputs.step == 'stage' }}
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          python3 -m pip install --quiet pillow
      - name: Data for the week
        if: ${{ steps.w.outputs.step == 'stage' }}
        run: node weekly_report.mjs --date ${{ steps.w.outputs.date }} --data-only
      - name: Editorial note (OpenRouter) + fact-check
        if: ${{ steps.w.outputs.step == 'stage' }}
        run: node weekly_notes.mjs --date ${{ steps.w.outputs.date }}
      - name: Render article, PDF, images
        if: ${{ steps.w.outputs.step == 'stage' }}
        run: node weekly_report.mjs --date ${{ steps.w.outputs.date }}
      - name: Publish the files (branch images, weekly/<slug>/)
        if: ${{ steps.w.outputs.step == 'stage' }}
        id: files
        run: |
          set -e
          OUT="reports/out/${{ steps.w.outputs.date }}-flow"
          SLUG=$(node -e "console.log(require('./$OUT/assets.json').slug)")
          git config user.name "wtp-bot"; git config user.email "wtp-bot@users.noreply.github.com"
          git fetch origin images
          git worktree add -B images ../_images origin/images
          mkdir -p "../_images/weekly/$SLUG"
          node -e "const m=require('./$OUT/assets.json');const fs=require('fs');for(const a of Object.values(m.assets))fs.copyFileSync('$OUT/'+a.file,'../_images/weekly/$SLUG/'+a.name)"
          cd ../_images && git add -A && (git diff --cached --quiet || git commit -m "weekly $SLUG") && git push origin HEAD:images
          echo "base=https://raw.githubusercontent.com/${{ github.repository }}/images/weekly/$SLUG" >> "$GITHUB_OUTPUT"
      - name: WordPress draft + review e-mail
        if: ${{ steps.w.outputs.step == 'stage' }}
        env:
          ASSET_BASE: ${{ steps.files.outputs.base }}
        run: node weekly_stage.mjs --date ${{ steps.w.outputs.date }} ${{ github.event.inputs.mail == '0' && '--no-mail' || '' }}

      # ---------------- Monday: publish
      - name: Publish (site + forum) and queue LinkedIn in Buffer
        if: ${{ steps.w.outputs.step == 'publish' }}
        run: node weekly_publish.mjs --date ${{ steps.w.outputs.date }}

      - name: Keep notes + state in the repo
        if: always()
        run: |
          git config user.name "wtp-bot"; git config user.email "wtp-bot@users.noreply.github.com"
          for i in 1 2 3; do
            git add reports/notes state/weekly.json 2>/dev/null || true
            git diff --cached --quiet && exit 0
            git commit -q -m "weekly ${{ steps.w.outputs.step }} ${{ steps.w.outputs.date }}"
            git pull -q --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
