name: radar-analyze

# Phase 2 of the move off OpenRouter (owner 2026-10-24): the server's media steps (fetch the day's articles + screen them for projects)
# run here with Claude Haiku 5.5 on the owner's subscription (radar/analyze_actions.py, server code copies in radar/pipeline/).
# SHADOW ONLY: writes nothing to the site; compares with what the server published today -> state/analyze_shadow_report.md.
# Pause switch: repository variable ANALYZE_PAUSED = true. A push that touches radar/analyze_run_now.txt starts one run.

on:
  push:
    paths: ['radar/analyze_run_now.txt']
  # the server pipeline runs 07:30 UTC and publishes ~07:40
  # 2026-10-25: schedule off - radar-pipeline.yml now runs the whole pipeline (fetch + screen included). It also ran at 07:52, before
  # the server's 14:30 run, so its "server rows today" were always 0. Its article / opportunity files no longer go into this public repo.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar-analyze
  cancel-in-progress: false

jobs:
  run:
    if: ${{ vars.ANALYZE_PAUSED != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      WTP_BOT_SECRET: ${{ secrets.WTP_BOT_SECRET }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      WTP_CF_BYPASS: ${{ secrets.WTP_CF_BYPASS }}
      ANALYZE_MODEL: ${{ vars.ANALYZE_MODEL || 'claude-haiku-5-5' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        run: |
          test -n "$WTP_BOT_SECRET" || { echo "::error::Secret WTP_BOT_SECRET is missing"; exit 1; }
          test -n "$CLAUDE_CODE_OAUTH_TOKEN" || { echo "::error::Secret CLAUDE_CODE_OAUTH_TOKEN is missing"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r radar/requirements.txt
      - run: npm install -g @anthropic-ai/claude-code@latest && claude --version
      - name: Fetch + screen (shadow)
        run: python radar/analyze_actions.py
      - name: Save state (articles seen, results, report)
        if: always()
        run: |
          git config user.name "wtp-bot"
          git config user.email "wtp-bot@users.noreply.github.com"
          git add -A state/radar_articles state/analyze_shadow_report.md 2>/dev/null; true
          git diff --cached --quiet || (git commit -m "radar analyze state $(date -u +%F)" && git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }})
