name: dedupe-projects

# Merge duplicate Infrastructure projects (one project reported by several outlets / on several days)
# and send the marks to the site. Recomputes everything each run, so it is safe to run any time;
# it also runs inside linkedin-daily before the day's posts are picked.
# Twice a day so a late pipeline ingest is covered. Pause: repository variable DEDUPE_PAUSED = true

on:
  schedule:
    - cron: '23 9 * * *'
    - cron: '23 16 * * *'
  workflow_dispatch:

concurrency:
  group: dedupe-projects
  cancel-in-progress: false

jobs:
  run:
    if: ${{ vars.DEDUPE_PAUSED != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WTP_BOT_SECRET: ${{ secrets.WTP_BOT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 dedupe_projects.py

  # 2026-11-27 (owner): the site sometimes refuses GitHub runners for a while (HTTP 403 for 10-30 minutes), and the run gives up.
  # One more try an hour later from a new runner. The second try is started by workflow_dispatch, which never retries: no loop.
  retry:
    needs: run
    if: ${{ failure() && github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 3600
          gh workflow run dedupe.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"
