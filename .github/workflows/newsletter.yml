name: newsletter

# E-mail editions from the public API -> Amazon SES, one message per subscriber of the site's own list.
#   flow     : "Trade Flow Weekly", Mondays ~04:20 UTC
#   projects : "EPC Project Leads Weekly", Tuesdays ~04:15 UTC
# Needs secrets AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY (IAM user that may only send via SES) and WTP_BOT_SECRET.
# Pause everything: repository variable NEWSLETTER_PAUSED = true

on:
  schedule:
    - cron: '23 4 * * 1'     # Trade Flow Weekly
    - cron: '13 4 * * 2'     # EPC Project Leads Weekly
  workflow_dispatch:
    inputs:
      edition:
        description: 'flow or projects'
        required: true
        default: 'projects'

permissions:
  contents: write

concurrency:
  group: newsletter
  cancel-in-progress: false

jobs:
  run:
    if: ${{ vars.NEWSLETTER_PAUSED != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      WTP_BOT_SECRET: ${{ secrets.WTP_BOT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Pick the edition
        id: ed
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then E="${{ inputs.edition }}";
          elif [ "${{ github.event.schedule }}" = "13 4 * * 2" ]; then E=projects; else E=flow; fi
          echo "edition=$E" >> "$GITHUB_OUTPUT"; echo "Edition: $E"
      - name: Check secrets
        run: |
          test -n "$AWS_ACCESS_KEY_ID" && test -n "$AWS_SECRET_ACCESS_KEY" || { echo "::error::AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY missing"; exit 1; }
          test -n "$WTP_BOT_SECRET" || { echo "::error::WTP_BOT_SECRET missing"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build the issue
        run: node newsletter.mjs --edition ${{ steps.ed.outputs.edition }}
      - name: Send through Amazon SES
        run: node ses_send.mjs --edition ${{ steps.ed.outputs.edition }}
      - name: Keep the issue + state in the repo
        # Another newsletter run may have pushed meanwhile (a dispatch runs the commit it was started on):
        # merge the sent-record JSON by key instead of rebasing, and stage only this issue's files.
        if: always()
        run: |
          git config user.name "wtp-bot"
          git config user.email "wtp-bot@users.noreply.github.com"
          N="$(date -u +%F)-${{ steps.ed.outputs.edition }}"
          for i in 1 2 3; do
            git fetch -q origin main
            git show origin/main:state/newsletter.json > /tmp/remote.json 2>/dev/null || echo '{}' > /tmp/remote.json
            test -f state/newsletter.json || echo '{}' > state/newsletter.json
            node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('/tmp/remote.json'));const l=JSON.parse(fs.readFileSync('state/newsletter.json'));fs.writeFileSync('state/newsletter.json',JSON.stringify({...r,...l},null,2)+'
')"
            git reset -q --mixed origin/main
            git add state/newsletter.json newsletter/out/$N.* 2>/dev/null || true
            git diff --cached --quiet && exit 0
            git commit -q -m "newsletter $N"
            git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
