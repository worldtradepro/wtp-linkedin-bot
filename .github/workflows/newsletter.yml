name: newsletter

# World Trade Pro Weekly: ONE e-mail every Tuesday (owner decision 2026-10-05; Trade Flow Weekly + EPC Project Leads Weekly merged).
#   newsletter_weekly.mjs builds the week's sector-tagged blocks from the public API; ses_send.mjs assembles a personal
#   version per subscriber (their sectors first, the rest folded) and sends through Amazon SES.
# Needs secrets AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY (IAM user that may only send via SES) and WTP_BOT_SECRET.
# Pause everything: repository variable NEWSLETTER_PAUSED = true

on:
  # GitHub starts this repo's scheduled runs late (2026-09-29: 04:13 -> 10:41), so Tuesday has three triggers from just
  # after midnight UTC; the first one sends, the later ones find the issue sent (state/newsletter.json) and stop.
  schedule:
    - cron: '13 0 * * 2'     # Tuesday: World Trade Pro Weekly
    - cron: '13 2 * * 2'
    - cron: '13 4 * * 2'
  workflow_dispatch:
    inputs:
      edition:
        description: 'weekly (default), check (SES permissions smoke test, no subscriber mail), or the legacy flow / projects'
        required: true
        default: 'weekly'
      to:
        description: 'Test: send only to this address (no state written). Optional.'
        required: false
        default: ''
      sectors:
        description: 'Test: pretend the test recipient follows these sectors, e.g. metals,energy. Optional.'
        required: false
        default: ''
      role:
        description: 'Test: pretend the test recipient has this role, e.g. epc. Optional.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: newsletter
  cancel-in-progress: false

jobs:
  run:
    if: ${{ vars.NEWSLETTER_PAUSED != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      WTP_BOT_SECRET: ${{ secrets.WTP_BOT_SECRET }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}   # editor's notes (weekly_editor.mjs); OPENROUTER_API_KEY works too
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Pick the edition
        id: ed
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then E="${{ inputs.edition }}"; else E=weekly; fi
          echo "edition=$E" >> "$GITHUB_OUTPUT"; echo "Edition: $E"
          T="${{ inputs.to }}"; S="${{ inputs.sectors }}"; R="${{ inputs.role }}"
          TEST=""; [ -n "$T" ] && TEST="--to $T"; [ -n "$S" ] && TEST="$TEST --sectors $S"; [ -n "$R" ] && TEST="$TEST --role $R"
          echo "test=$TEST" >> "$GITHUB_OUTPUT"
      - name: Check secrets
        run: |
          test -n "$AWS_ACCESS_KEY_ID" && test -n "$AWS_SECRET_ACCESS_KEY" || { echo "::error::AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY missing"; exit 1; }
          test -n "$WTP_BOT_SECRET" || { echo "::error::WTP_BOT_SECRET missing"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: SES permissions check
        if: steps.ed.outputs.edition == 'check'
        run: node ses_send.mjs --check
      - name: Build the issue
        if: steps.ed.outputs.edition != 'check'
        run: |
          if [ "${{ steps.ed.outputs.edition }}" = weekly ]; then node newsletter_weekly.mjs --preview; else node newsletter.mjs --edition ${{ steps.ed.outputs.edition }}; fi
      - name: Editor's notes (one model call, checked in code) and rebuild with them
        # a failed or skipped editor never blocks the issue: without notes the rule-based sentences stay
        if: steps.ed.outputs.edition == 'weekly'
        continue-on-error: true
        run: |
          node weekly_editor.mjs && node newsletter_weekly.mjs --preview
      - name: Send through Amazon SES
        if: steps.ed.outputs.edition != 'check'
        run: node ses_send.mjs --edition ${{ steps.ed.outputs.edition }} ${{ steps.ed.outputs.test }}
      - name: Keep the issue + state in the repo
        # Another run may have pushed meanwhile (a dispatch runs the commit it was started on): merge the sent-record
        # JSON by key instead of rebasing, and stage only this issue's files. A --to test send writes no state.
        if: always() && steps.ed.outputs.edition != 'check' && steps.ed.outputs.test == ''
        run: |
          git config user.name "wtp-bot"
          git config user.email "wtp-bot@users.noreply.github.com"
          N="$(date -u +%F)-${{ steps.ed.outputs.edition }}"
          for i in 1 2 3; do
            git fetch -q origin main
            git show origin/main:state/newsletter.json > /tmp/remote.json 2>/dev/null || echo '{}' > /tmp/remote.json
            test -f state/newsletter.json || echo '{}' > state/newsletter.json
            node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('/tmp/remote.json'));const l=JSON.parse(fs.readFileSync('state/newsletter.json'));fs.writeFileSync('state/newsletter.json',JSON.stringify({...r,...l},null,2)+String.fromCharCode(10))"
            git reset -q --mixed origin/main
            git add state/newsletter.json newsletter/out/$N.* newsletter/notes/$N.json 2>/dev/null || true
            git diff --cached --quiet && exit 0
            git commit -q -m "newsletter $N"
            git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
