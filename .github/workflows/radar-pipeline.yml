name: radar-pipeline

# The whole EPC Radar daily pipeline on Actions (owner 2026-10-25: move all of it off the server) - radar/pipeline_actions.py running the
# server's code copy in radar/server/ with Claude Haiku 5.5 instead of OpenRouter.
# PIPELINE_MODE (repository variable): shadow (default) = writes nothing, compares with the server's 14:38 UTC publish ->
# state/pipeline_shadow_report.md; write = publishes the day's rows and keeps state/radar_data/ (only after the server cron is paused:
# publishing replaces the day's rows, so there must be one writer per day).
# Pause switch: repository variable PIPELINE_PAUSED = true. A push that touches radar/pipeline_run_now.txt starts one run.

on:
  push:
    paths: ['radar/pipeline_run_now.txt']
  # the server runs 14:30 UTC and publishes ~14:38; shadow compares after that
  schedule:
    - cron: '50 14 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar-pipeline
  cancel-in-progress: false

jobs:
  run:
    if: ${{ vars.PIPELINE_PAUSED != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      WTP_BOT_SECRET: ${{ secrets.WTP_BOT_SECRET }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      WTP_CF_BYPASS: ${{ secrets.WTP_CF_BYPASS }}
      ANALYZE_MODEL: ${{ vars.ANALYZE_MODEL || 'claude-haiku-5-5' }}
      PIPELINE_MODE: ${{ vars.PIPELINE_MODE || 'shadow' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        run: |
          test -n "$WTP_BOT_SECRET" || { echo "::error::Secret WTP_BOT_SECRET is missing"; exit 1; }
          test -n "$CLAUDE_CODE_OAUTH_TOKEN" || { echo "::error::Secret CLAUDE_CODE_OAUTH_TOKEN is missing"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r radar/requirements.txt pypdf
      - run: npm install -g @anthropic-ai/claude-code@latest && claude --version
      - name: Pipeline (${{ env.PIPELINE_MODE }})
        run: python radar/pipeline_actions.py
      - name: Save state (seen lists in write mode, shadow report)
        if: always()
        run: |
          git config user.name "wtp-bot"
          git config user.email "wtp-bot@users.noreply.github.com"
          git add state/radar_data state/pipeline_shadow_report.md 2>/dev/null; true
          git diff --cached --quiet || (git commit -m "radar pipeline state $(date -u +%F)" && git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }})
