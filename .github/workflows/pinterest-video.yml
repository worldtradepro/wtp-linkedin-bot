name: pinterest-video

# Books ONE queued Commodity Decoded video (same R2 queue as linkedin-video / instagram-video) onto Buffer as a Pinterest video pin on the
# "Commodity Decoded" board; the pin link is the free weekly newsletter page (config.json -> pinterest.url). Books one day ahead at
# config.json -> pinterest.slotUtc, so late or repeated runs are safe (a day that already has a pin is skipped).
# Pause: Variables -> BOT_PAUSED = true (pauses everything), or config.json pinterest.paused = true.
# Uses the same BUFFER_API_KEY secret as the LinkedIn bot (that Buffer account holds the Pinterest channel).

on:
  schedule:
    - cron: '41 4 * * *'
    - cron: '41 10 * * *'
    - cron: '41 16 * * *'
  workflow_dispatch:
    inputs:
      check_only:
        description: 'Only find the Buffer Pinterest channel (no pin)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: pinterest-video
  cancel-in-progress: false

jobs:
  push-pin:
    if: ${{ vars.BOT_PAUSED != 'true' }}
    runs-on: ubuntu-latest
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Require the secret
        run: test -n "$BUFFER_API_KEY" || { echo "::error::Secret BUFFER_API_KEY is missing"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check only
        if: ${{ inputs.check_only }}
        run: node push_pinterest.mjs --check
      - name: Book the next queued video as a pin
        if: ${{ !inputs.check_only }}
        run: node push_pinterest.mjs
      - name: Save state
        if: ${{ !inputs.check_only }}
        run: |
          git config user.name "wtp-bot"
          git config user.email "wtp-bot@users.noreply.github.com"
          git add state/pin_pushed.json || true
          git diff --cached --quiet || (git commit -m "pinterest state $(date -u +%F)" && git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }})
