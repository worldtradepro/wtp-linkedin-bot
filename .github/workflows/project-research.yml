name: project-research

# Deep research briefs (radar/project_research.py): a member asked for a brief on a project, or the site queued one.
# Starts at once when the site sends a "research" dispatch (a member clicked), and looks at the queue every 10 minutes
# otherwise. A run with nothing to do ends in under a minute. Nothing is committed: briefs go to the site only.
on:
  schedule:
    - cron: '*/10 * * * *'
  repository_dispatch:
    types: [research]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-research
  cancel-in-progress: false

jobs:
  run:
    if: ${{ vars.PROJECT_RESEARCH_PAUSED != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      WTP_BOT_SECRET: ${{ secrets.WTP_BOT_SECRET }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      WTP_CF_BYPASS: ${{ secrets.WTP_CF_BYPASS }}
      RS_MODEL: ${{ vars.RS_MODEL || 'claude-sonnet-5-5' }}
      RS_BATCH: ${{ vars.RS_BATCH || '5' }}
      RS_MINUTES: ${{ vars.RS_MINUTES || '45' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Anything waiting?
        id: q
        run: echo "n=$(python radar/project_research.py --count | tail -1)" >> "$GITHUB_OUTPUT"
      - name: Install Claude Code
        if: ${{ steps.q.outputs.n != '0' }}
        run: npm install -g @anthropic-ai/claude-code@latest && claude --version
      - name: Research
        if: ${{ steps.q.outputs.n != '0' }}
        run: python radar/project_research.py
